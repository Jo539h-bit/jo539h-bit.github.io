<svg viewBox="0 0 1000 420" xmlns="http://www.w3.org/2000/svg" font-family="Inter, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#4F8EF7"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#22C55E"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="420" fill="#161B27"/>

  <!-- row 1 -->
  <g font-size="13" font-weight="600">
    <!-- Google Form -->
    <rect x="30" y="50" width="160" height="64" rx="10" fill="#1A2035" stroke="#2A3050"/>
    <text x="110" y="78" fill="#FFFFFF" text-anchor="middle">Google Form</text>
    <text x="110" y="96" fill="#888888" font-size="11" font-weight="400" text-anchor="middle">influencer signup</text>

    <path d="M190 82 H238" stroke="#4F8EF7" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Apps Script -->
    <rect x="240" y="50" width="160" height="64" rx="10" fill="#1A2035" stroke="#2A3050"/>
    <text x="320" y="78" fill="#FFFFFF" text-anchor="middle">Apps Script</text>
    <text x="320" y="96" fill="#888888" font-size="11" font-weight="400" text-anchor="middle">onFormSubmit → POST</text>

    <path d="M400 82 H448" stroke="#4F8EF7" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Webhook -->
    <rect x="450" y="50" width="160" height="64" rx="10" fill="#1A2035" stroke="#2A3050"/>
    <text x="530" y="78" fill="#FFFFFF" text-anchor="middle">n8n Webhook</text>
    <text x="530" y="96" fill="#888888" font-size="11" font-weight="400" text-anchor="middle">instant trigger</text>

    <path d="M610 82 H658" stroke="#4F8EF7" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Coupon logic -->
    <rect x="660" y="50" width="200" height="64" rx="10" fill="#1A2035" stroke="#4F8EF7"/>
    <text x="760" y="72" fill="#FFFFFF" text-anchor="middle">Dedupe + Coupon Logic</text>
    <text x="760" y="90" fill="#7EB3FF" font-size="11" font-weight="400" text-anchor="middle">uniqueness-checked against sheet</text>
    <text x="760" y="104" fill="#888888" font-size="10" font-weight="400" text-anchor="middle">duplicate → flagged branch (not shown)</text>
  </g>

  <!-- connector down -->
  <path d="M760 114 V150 Q760 164 746 164 H190" stroke="#4F8EF7" stroke-width="2" fill="none"/>
  <path d="M190 164 V196" stroke="#4F8EF7" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- row 2 -->
  <g font-size="13" font-weight="600">
    <!-- Sheets -->
    <rect x="30" y="198" width="160" height="64" rx="10" fill="#1A2035" stroke="#2A3050"/>
    <text x="110" y="226" fill="#FFFFFF" text-anchor="middle">Google Sheets</text>
    <text x="110" y="244" fill="#888888" font-size="11" font-weight="400" text-anchor="middle">partner record saved</text>

    <path d="M190 230 H238" stroke="#4F8EF7" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Gmail welcome -->
    <rect x="240" y="198" width="160" height="64" rx="10" fill="#1A2035" stroke="#2A3050"/>
    <text x="320" y="226" fill="#FFFFFF" text-anchor="middle">Gmail</text>
    <text x="320" y="244" fill="#888888" font-size="11" font-weight="400" text-anchor="middle">welcome + code + link</text>

    <path d="M400 230 H448" stroke="#22C55E" stroke-width="2" marker-end="url(#arrowGreen)"/>

    <!-- Wait -->
    <rect x="450" y="198" width="160" height="64" rx="10" fill="#1A2035" stroke="#22C55E"/>
    <text x="530" y="226" fill="#FFFFFF" text-anchor="middle">Wait 30 min</text>
    <text x="530" y="244" fill="#bbf7d0" font-size="11" font-weight="400" text-anchor="middle">persisted to DB, survives restarts</text>

    <path d="M610 230 H658" stroke="#22C55E" stroke-width="2" marker-end="url(#arrowGreen)"/>

    <!-- Reminder -->
    <rect x="660" y="198" width="200" height="64" rx="10" fill="#1A2035" stroke="#2A3050"/>
    <text x="760" y="226" fill="#FFFFFF" text-anchor="middle">Gmail</text>
    <text x="760" y="244" fill="#888888" font-size="11" font-weight="400" text-anchor="middle">reminder: objective + rewards</text>
  </g>

  <!-- footer strip -->
  <rect x="30" y="300" width="830" height="90" rx="10" fill="#0F1117" stroke="#2A3050"/>
  <text x="50" y="328" fill="#4F8EF7" font-size="11" font-weight="700" letter-spacing="1">PIPELINE</text>
  <text x="50" y="352" fill="#CCCCCC" font-size="13">Form submit → coupon live + 2 emails sent in under a second → 30-minute reminder, zero manual steps</text>
  <text x="50" y="374" fill="#888888" font-size="11">Coupon format: brand prefix + name-derived letters, with numeric fallback on collision — checked against the live sheet before issuing</text>
</svg>
